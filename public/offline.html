<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#166534">
    <title>Agriculture Tractor Offline</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f8fafc;
            --card: rgba(255, 255, 255, 0.92);
            --border: #dbe4ee;
            --text: #0f172a;
            --muted: #475569;
            --accent: #166534;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top, rgba(22, 101, 52, 0.16), transparent 35%),
                linear-gradient(180deg, #eff6ff 0%, var(--bg) 55%, #ecfccb 100%);
            color: var(--text);
        }

        .card {
            width: min(100%, 460px);
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--card);
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.10);
            backdrop-filter: blur(18px);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(22, 101, 52, 0.12);
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 18px 0 12px;
            font-size: clamp(28px, 5vw, 40px);
            line-height: 1.05;
            letter-spacing: -0.03em;
        }

        p {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        .button.primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 12px 24px rgba(22, 101, 52, 0.22);
        }

        .button.secondary {
            border: 1px solid var(--border);
            color: var(--text);
            background: white;
        }

        .button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge">Offline mode</div>
        <h1>You're offline right now.</h1>
        <p>
            The app shell is still available on your phone. Open pages you already visited once the connection returns,
            or refresh after network is back.
        </p>
        <div class="actions">
            <a class="button primary" href="/">Try again</a>
            <a class="button secondary" href="/dashboard">Open dashboard</a>
        </div>
    </main>
</body>
</html>
